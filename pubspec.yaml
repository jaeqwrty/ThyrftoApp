name: thryfto
description: A thrift shopping mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  share_plus: ^10.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  timeago: ^3.6.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  cloud_firestore: ^5.4.4
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.0
  http: ^1.1.0
  qr_flutter: ^4.1.0
  googleapis: ^11.0.0
  googleapis_auth: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# --- ADD THIS SECTION AT THE BOTTOM ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/QualityThryftoLogo.png"
  min_sdk_android: 21 # Icons will be generated for Android 5.0 and above
# --------------------------------------

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/QualityThryftoLogo.png
  
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: fonts/SF-Pro-Display-Light.otf
          weight: 300